name: Release

# Triggered by pushing the `emma65-vX.Y.Z` tag. A release packages every
# workspace binary — the emulator CLI (emma65, emma65-tracer), the SDL2
# peripheral binaries (emma65-display, emma65-led-matrix, emma65-lcd-display),
# and the Tauri debugger GUI (emma65-debugger) — into one combined `emma65`
# .deb and .rpm. See .claude/skills/release/ for the human-gated process that
# produces this tag.
#
# The other four workspace crates keep their own independent version and
# CHANGELOG for bookkeeping via the same skill, but bumping one of them no
# longer triggers its own build/publish here — its current state is simply
# folded into the next `emma65-v*` combined package build.
#
# The `push: tags:` trigger above looks sufficient but in practice never fires for this
# repo's process: GitHub Actions dedupes check-suites by (repo, head_sha, app), and every
# release tag points at a commit that was already pushed to `main` as part of merging the
# version-bump PR — so it already has a completed Actions check-suite by the time it's
# tagged, and the tag push creates no new one. `workflow_dispatch` is the real trigger in
# practice: dispatch with `--ref main` (so the run picks up this trigger definition) and
# `-f tag=emma65-vX.Y.Z` naming the already-pushed tag; the build job's checkout below pins
# to that tag explicitly, so the build still comes from the tagged commit regardless of
# which ref the workflow definition itself was read from.
on:
  push:
    tags:
      - 'emma65-v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (must already exist), e.g. emma65-v0.1.0"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve tag and verify version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Parse tag
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#emma65-v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify committed version matches tag
        run: |
          version="${{ steps.parse.outputs.version }}"
          cargo_version=$(grep -m1 '^version *= *"' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::Cargo.toml has version '$cargo_version', tag says '$version'"
            exit 1
          fi

      - name: Extract release notes
        run: |
          version="${{ steps.parse.outputs.version }}"

          awk -v ver="$version" '
            /^## \[/ { if (found) exit; if ($0 ~ "\\[" ver "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::no changelog entry found for $version in CHANGELOG.md"
            exit 1
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "This release bundles:"
            echo ""
            echo "- emma65 $version"
            for entry in \
              "emma65-display:display" \
              "emma65-led-matrix:led-matrix" \
              "emma65-lcd-display:lcd-display" \
              "emma65-debugger:debugger/src-tauri"
            do
              crate="${entry%%:*}"
              dir="${entry#*:}"
              component_version=$(grep -m1 '^version *= *"' "$dir/Cargo.toml" | sed -E 's/^version *= *"([^"]+)".*/\1/')
              echo "- [$crate $component_version]($dir/CHANGELOG.md)"
            done
          } >> release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build-package:
    name: Build combined package
    needs: resolve
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Node toolchain
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: debugger/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: debugger/frontend
        run: npm ci

      - name: Cache packaging tools
        id: cache-packaging-tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-deb
            ~/.cargo/bin/cargo-generate-rpm
          key: packaging-tools-1-${{ runner.os }}

      - name: Install packaging tools
        if: steps.cache-packaging-tools.outputs.cache-hit != 'true'
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo install cargo-deb --locked
          cargo install cargo-generate-rpm --locked

      - name: Build CLI and peripheral binaries
        run: cargo build --release -p emma65 -p emma65-display -p emma65-led-matrix -p emma65-lcd-display

      - name: Build debugger binary
        working-directory: debugger/src-tauri
        run: cargo tauri build --no-bundle

      - name: Package .deb
        run: cargo deb -p emma65 --no-build

      # cargo-generate-rpm's `-p`/`--package` expects a path to the crate's
      # directory, not a package name (unlike cargo-deb's `-p`) — since the
      # root `emma65` package's directory is the workspace root itself, the
      # plain default (run from the checkout root, no flag) is what selects
      # it correctly.
      - name: Package .rpm
        run: cargo generate-rpm

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-asset
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  publish:
    name: Publish GitHub Release
    needs: [resolve, build-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: release-asset
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t assets < <(find dist -type f)
          gh release create "${{ needs.resolve.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "emma65 ${{ needs.resolve.outputs.version }}" \
            --notes-file release-notes.md \
            "${assets[@]}"
