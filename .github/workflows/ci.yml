name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      debugger: ${{ steps.filter.outputs.debugger }}
      display: ${{ steps.filter.outputs.display }}
      led-matrix: ${{ steps.filter.outputs.led-matrix }}
      lcd-display: ${{ steps.filter.outputs.lcd-display }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            debugger:
              - 'debugger/**'
            display:
              - 'display/**'
            led-matrix:
              - 'led-matrix/**'
            lcd-display:
              - 'lcd-display/**'

  ci:
    name: Build, Clippy, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Only the main-branch push pays the ~2min cache-save cost; PR and
          # merge_group runs restore-only from whatever main last saved. CI
          # previously only ran on pull_request/merge_group, so every cache
          # was scoped to a PR ref that vanished on merge — a guaranteed miss
          # for every subsequent PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build -p emma65

      - name: Clippy
        run: cargo clippy -p emma65 --all-targets --no-deps -- -D warnings

      - name: Test
        run: cargo test -p emma65

  ci-debugger:
    name: Debugger Build and Clippy
    needs: changes
    if: needs.changes.outputs.debugger == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Only the main-branch push pays the ~2min cache-save cost; PR and
          # merge_group runs restore-only from whatever main last saved. CI
          # previously only ran on pull_request/merge_group, so every cache
          # was scoped to a PR ref that vanished on merge — a guaranteed miss
          # for every subsequent PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build -p emma65-debugger

      - name: Clippy
        working-directory: debugger/src-tauri
        run: cargo clippy --no-deps -- -D warnings

      - name: Install Node toolchain
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: debugger/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: debugger/frontend
        run: npm ci

      - name: Frontend lint
        working-directory: debugger/frontend
        run: npm run lint

      - name: Frontend format check
        working-directory: debugger/frontend
        run: npm run format:check

      - name: Frontend test
        working-directory: debugger/frontend
        run: npm test

  ci-display:
    name: Display Build and Clippy
    needs: changes
    if: needs.changes.outputs.display == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Only the main-branch push pays the ~2min cache-save cost; PR and
          # merge_group runs restore-only from whatever main last saved. CI
          # previously only ran on pull_request/merge_group, so every cache
          # was scoped to a PR ref that vanished on merge — a guaranteed miss
          # for every subsequent PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build -p emma65-display

      - name: Clippy
        run: cargo clippy -p emma65-display --all-targets --no-deps -- -D warnings

  ci-led-matrix:
    name: LED Matrix Build and Clippy
    needs: changes
    if: needs.changes.outputs.led-matrix == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Only the main-branch push pays the ~2min cache-save cost; PR and
          # merge_group runs restore-only from whatever main last saved. CI
          # previously only ran on pull_request/merge_group, so every cache
          # was scoped to a PR ref that vanished on merge — a guaranteed miss
          # for every subsequent PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build -p emma65-led-matrix

      - name: Clippy
        run: cargo clippy -p emma65-led-matrix --all-targets --no-deps -- -D warnings

  ci-lcd-display:
    name: LCD Display Build and Clippy
    needs: changes
    if: needs.changes.outputs.lcd-display == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}-ci:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Only the main-branch push pays the ~2min cache-save cost; PR and
          # merge_group runs restore-only from whatever main last saved. CI
          # previously only ran on pull_request/merge_group, so every cache
          # was scoped to a PR ref that vanished on merge — a guaranteed miss
          # for every subsequent PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build -p emma65-lcd-display

      - name: Clippy
        run: cargo clippy -p emma65-lcd-display --all-targets --no-deps -- -D warnings
