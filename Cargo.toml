[workspace]
members = [
    ".",
    "build-info",
    "core",
    "emma09",
    "debugger/src-tauri",
    "display",
    "led-matrix",
    "lcd-display",
]
resolver = "2"

[package]
name = "emma65"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A 6502-family computer emulator, with an emulator CLI, SDL2 peripheral displays, and a Tauri debugger GUI"
authors = ["Carl Harris"]
repository = "https://github.com/ceharris/emma6k"

[[bin]]
name = "emma65"
path = "src/bin/emulator/main.rs"

[[bin]]
name = "emma65-tracer"
path = "src/bin/tracer/main.rs"

[lib]
name = "emma65"
path = "src/lib.rs"

[dependencies]
# The CPU-neutral core. Versioned in lockstep with this crate: keep the two
# version numbers equal (see the release skill).
emma6k-core = { path = "core", version = "0.1.0" }
bitflags = "2"
crossbeam-channel = "0.5"
libc = "0.2"
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "sync", "macros", "fs", "time", "signal", "process"] }
# Emulator configuration
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
env_logger = "0.11.11"
tempfile = "3.27"

[build-dependencies]
emma6k-build-info = { path = "build-info" }

[dev-dependencies]

# Combined apt/dnf packaging for every workspace binary (the emulator CLI,
# the SDL2 peripheral binaries, and the Tauri debugger GUI) into one `emma6k`
# package. Built via `cargo deb`/`cargo generate-rpm` from release.yml, not
# by plain `cargo build`. `depends`/`auto-req` detect the SDL2 and
# webkit2gtk/gtk3 runtime libraries straight off the binaries being
# packaged, rather than hand-listing distro package names that can drift.
[package.metadata.deb]
name = "emma6k"
depends = "$auto"
section = "utils"
priority = "optional"
extended-description = """\
The emma6k emulator and debugger toolkit: the emma65 (6502-family) emulator \
CLI and emma65-tracer, SDL2-backed peripheral displays (emma6k-display, emma6k-led-matrix, \
emma6k-lcd-display), and the emma6k-debugger GUI, all in one package."""
assets = [
    ["target/release/emma65", "usr/bin/", "755"],
    ["target/release/emma65-tracer", "usr/bin/", "755"],
    ["target/release/emma6k-display", "usr/bin/", "755"],
    ["target/release/emma6k-led-matrix", "usr/bin/", "755"],
    ["target/release/emma6k-lcd-display", "usr/bin/", "755"],
    ["target/release/emma6k-debugger", "usr/bin/", "755"],
    ["packaging/emma6k-debugger.desktop", "usr/share/applications/", "644"],
    ["debugger/src-tauri/icons/32x32.png", "usr/share/icons/hicolor/32x32/apps/emma6k-debugger.png", "644"],
    ["debugger/src-tauri/icons/128x128.png", "usr/share/icons/hicolor/128x128/apps/emma6k-debugger.png", "644"],
    ["LICENSE", "usr/share/doc/emma6k/", "644"],
]

[package.metadata.generate-rpm]
name = "emma6k"
auto-req = "auto"
assets = [
    { source = "target/release/emma65", dest = "/usr/bin/emma65", mode = "755" },
    { source = "target/release/emma65-tracer", dest = "/usr/bin/emma65-tracer", mode = "755" },
    { source = "target/release/emma6k-display", dest = "/usr/bin/emma6k-display", mode = "755" },
    { source = "target/release/emma6k-led-matrix", dest = "/usr/bin/emma6k-led-matrix", mode = "755" },
    { source = "target/release/emma6k-lcd-display", dest = "/usr/bin/emma6k-lcd-display", mode = "755" },
    { source = "target/release/emma6k-debugger", dest = "/usr/bin/emma6k-debugger", mode = "755" },
    { source = "packaging/emma6k-debugger.desktop", dest = "/usr/share/applications/emma6k-debugger.desktop", mode = "644" },
    { source = "debugger/src-tauri/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/emma6k-debugger.png", mode = "644" },
    { source = "debugger/src-tauri/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/emma6k-debugger.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/doc/emma6k/LICENSE", mode = "644" },
]
