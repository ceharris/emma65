[package]
name = "emma6k-lcd-display"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "emma6k-lcd-display"
path = "src/main.rs"

[dependencies]
emma65 = { path = ".." }
sdl2 = "0.38"
clap = { version = "4.0", features = ["derive"] }

[build-dependencies]
emma6k-build-info = { path = "../build-info" }
