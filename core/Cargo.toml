[package]
name = "emma6k-core"
# Versioned in lockstep with the root `emma65` crate: every emma65 release bumps
# both to the same version, and emma6k-core is never released on its own.
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The CPU-neutral emulator core of the emma6k project: bus, devices, transports, configuration, and execution control behind a Processor trait"
authors = ["Carl Harris"]
repository = "https://github.com/ceharris/emma6k"

[lib]
name = "emma6k_core"
path = "src/lib.rs"

[dependencies]
rand = "0.10"
thiserror = "2"
crossbeam-channel = "0.5"
libc = "0.2"
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "sync", "macros", "fs", "time", "signal", "process"] }
nix = { version = "0.29", features = ["fs", "ioctl", "term"] }
serde = { version = "1.0", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
log = "0.4.33"
rtrb = "0.3.4"
jiff = "0.2"

[dev-dependencies]
tempfile = "3.27"
